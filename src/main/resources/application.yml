# ==========================================================================
# CampusHub AI — 基础配置
# ==========================================================================
# 约定（docs/00-工程规约.md §15.5）：
#   · 本文件**提交入库**，因此绝不写任何真实凭据
#   · 所有可能含密的项一律用 ${ENV_VAR:安全默认值} 形式从环境变量注入
#   · 本地开发可 cp .env.example .env，Spring 会自动导入（见下方 spring.config.import）
# ==========================================================================

spring:
  application:
    name: camphub

  # 让 .env 文件（已被 .gitignore 忽略）无需手工 source 即可生效，
  # 这样命令行、IDEA、测试三种启动方式读到的配置完全一致。
  # optional: 前缀保证没有 .env 时也能正常启动。
  config:
    import: optional:file:./.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    # 关键点：显式指定连接时区。
    # MySQL 默认 time_zone=SYSTEM（见 docs/11-开发环境.md §5.1 实测），若不在连接串里固定，
    # 容器时区与 JVM 时区不一致时，"发布时间/时间衰减排序"会出现整体偏移。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:camphub}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${MYSQL_USER:camphub}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 起步值刻意保守。Phase 09 压测拿到真实数据后再调整，
      # 现在就调大只是把问题往后推，并掩盖真实瓶颈。
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      pool-name: camphub-hikari
      connection-timeout: 10000
      validation-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 不使用 baseline-on-migrate：它会让"库结构不符合预期"被静默跳过，
    # 属于把配置错误伪装成正常运行。宁可启动失败也不要静默错位。
    baseline-on-migrate: false
    validate-on-migrate: true
    # 已发布的迁移脚本禁止修改（docs/00-工程规约.md §15.8），
    # 校验和检查会在这里帮我们拦住这种改动。
    clean-disabled: true

  # HTTP 请求体大小上限：Phase 05 之前没有文件上传，保守设置
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    # 不把 Spring 默认错误响应的细节暴露出去；错误统一由 GlobalExceptionHandler 产出
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# ---------------------------------------------------------------------------
# MyBatis
# ---------------------------------------------------------------------------
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 主要为了日志里能看到真实执行的 SQL 与参数，便于 Phase 09 的慢 SQL 定位
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# ---------------------------------------------------------------------------
# 应用自定义配置
# ---------------------------------------------------------------------------
app:
  name: ${APP_NAME:camphub}
  # 版本号来源：Maven 资源过滤把 @project.version@ 替换为 pom.xml 里的 <version>。
  # （spring-boot-starter-parent 已为 application*.yml 打开过滤，分隔符是 @ 而不是 ${}，
  #   因此本文件里其他 ${ENV:default} 占位不会被 Maven 误替换。）
  # 仍然保留环境变量覆盖能力（APP_VERSION），用于在镜像/编排层面标注构建来源。
  # **不要在这里写死版本号** —— 写死的结果是 /api/v1/system/info 报出的版本
  # 与真实发布的版本长期不一致（Phase 02 收尾时就踩到过这一点）。
  version: ${APP_VERSION:@project.version@}

  # -------------------------------------------------------------------------
  # 身份与安全（Phase 02）
  # -------------------------------------------------------------------------
  # 纪律：本文件入库，因此这里只放**非密**的默认值。
  # 密钥类一律写成 ${ENV_VAR:} 的空默认值，由启动校验强制要求注入 ——
  # 与其用一个"能跑起来但人人可猜"的默认密钥，不如启动就失败。
  # -------------------------------------------------------------------------
  security:
    jwt:
      # 必须注入（生成方式：openssl rand -base64 48）。
      # 为空时应用启动失败，见 SecurityConfig#jwtEncoder 的显式校验。
      secret: ${APP_JWT_SECRET:}
      issuer: ${APP_JWT_ISSUER:camphub}
      # 15 分钟：短有效期的访问令牌让"撤销"最坏情况下也只延迟这么久
      access-token-ttl: 15m
      # 30 天：长有效期由"有状态 + 可轮换 + 可撤销"来担保，而不是靠短
      refresh-token-ttl: 30d
    password:
      # 只配最短长度。上限不在此配置：BCrypt 只使用前 72 字节，超长部分被静默丢弃
      # 是真实的强度损失，因此该约束写死在 PasswordPolicy 中并以"拒绝"而非"截断"处理。
      min-length: 10
    login:
      max-failures: 5
      lock-duration: 15m
    rate-limit:
      # 登录：同一 IP 每分钟 10 次。正常人手速远低于此，脚本撞库会立刻触顶
      login:
        capacity: 10
        window: 1m
      # 注册：同一 IP 每小时 5 次，压制批量注册
      register:
        capacity: 5
        window: 1h
      # 刷新：同一 IP 每分钟 30 次。前端多标签页会并发刷新，窗口给宽一些
      refresh:
        capacity: 30
        window: 1m

# ---------------------------------------------------------------------------
# 社区（Phase 03）
# ---------------------------------------------------------------------------
# 这里的数字都是**资源保护参数**：它们决定单个请求能让服务端做多少工作。
# 故意写得保守，等 Phase 09 的基线压测有了真实数据再调整 ——
# 现在放宽只是把问题往后推，并且会掩盖真正的瓶颈。
# ---------------------------------------------------------------------------
community:
  post:
    # 标签越多，每个标签页的内容越杂，"按标签浏览"越失去意义
    max-tags: 5
    # 正文上限（字符数）。这是资源保护上限而非体验问题：发布时会对正文做
    # Markdown 渲染 + 白名单净化，两步代价都与输入长度成正比
    max-body-length: 30000
    # 与 post.summary VARCHAR(300) 对齐；改这里必须同时改列宽，否则插入会报错
    summary-length: 300
  feed:
    default-page-size: 20
    # 服务端强制的页大小上限。超过时按上限截断而不是报错
    max-page-size: 50
  demo-seed:
    # **默认关闭**。一个会往业务表写数据的组件，在生产被误开启的代价
    # （一批看起来像真人的假数据）远高于打开它省下的那点事。
    # application-local.yml 中打开，测试 profile 保持关闭。
    enabled: ${APP_DEMO_SEED_ENABLED:false}
    # 规模可配：首次启动几十条就够看清界面，基线压测需要几个数量级更多
    author-count: ${APP_DEMO_SEED_AUTHORS:12}
    post-count: ${APP_DEMO_SEED_POSTS:60}
    comment-count: ${APP_DEMO_SEED_COMMENTS:240}

# ---------------------------------------------------------------------------
# 请求处理（HTTP 层通用）
# ---------------------------------------------------------------------------
# 放在 app.request 而不是 app.security，是为了让 common（共享内核）能承载它：
# 来源 IP 既被审计日志使用，也被限流使用，而审计属于 platform 模块、
# 限流属于 identity 模块。若把该配置放在 identity，platform 就得反向依赖 identity，
# 模块间立刻成环（ArchUnit 会直接让构建失败）。
# 它确实是安全相关设置，只是归属层级不同。
# ---------------------------------------------------------------------------
request:
  # 是否信任 X-Forwarded-For / X-Real-IP。
  # **默认 false**：这两个头由客户端随意伪造。若在没有可信反向代理的情况下信任它们，
  # 攻击者只要每个请求换一个值，就能让"按 IP 限流"完全失效，同时把审计日志里的来源
  # 写成一堆假地址。只有在明确部署于可信代理之后（且由代理**重写**而非追加该头）才可开启。
  trust-forwarded-headers: ${APP_TRUST_FORWARDED_HEADERS:false}

# ---------------------------------------------------------------------------
# 健康检查 / 监控端点
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # 只开必要端点。放开 * 会把内部信息（beans/env/heapdump）暴露成攻击面。
        include: health,info
  endpoint:
    health:
      # 默认不对外展示依赖细节（会暴露拓扑），local profile 中放开
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${app.name}
    version: ${app.version}

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
logging:
  pattern:
    # %X{traceId} 由 TraceIdFilter 写入 MDC。
    # 有它才能用用户报来的一个 ID 捞出该请求的全部日志。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-no-trace}] %logger{40} - %msg%n"
  level:
    root: INFO
    ai.camphub: INFO

# ---------------------------------------------------------------------------
# API 文档（springdoc）
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
