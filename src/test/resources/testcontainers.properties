# ==========================================================================
# Testcontainers 运行配置（测试专用，随代码提交）
# ==========================================================================
# 为什么需要这个文件：
# 本机 Docker Hub 直连不可达（见 docs/11-开发环境.md 7.2 节）。Testcontainers 启动时
# 默认会尝试拉取 testcontainers/ryuk（用于在测试结束后回收容器），拉取失败会导致
# 集成测试直接报错，且报错信息看起来像"测试代码有问题"，实际是环境问题。
#
# 处理方式：把 ryuk 镜像显式指向本地已存在的 tag（该镜像已通过镜像代理预先取到），
# 使集成测试完全不依赖外网。
#
# 若你的环境可以访问 Docker Hub，可删除本文件，或把该行改为任意可用 tag。
# 同时该键名 ryuk.container.image 已从 testcontainers-2.0.5 的
# TestcontainersConfiguration 常量中确认，非推测。
# ==========================================================================

ryuk.container.image=testcontainers/ryuk:0.11.0
