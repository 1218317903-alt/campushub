# ==========================================================================
# CampusHub AI — test profile（自动化测试）
# ==========================================================================
# 说明：数据源**不在此配置**。集成测试通过 Testcontainers 的 @ServiceConnection
#      动态注入连接信息（见 src/test/java/ai/camphub/support/TestcontainersConfiguration.java），
#      其优先级高于本文件与 .env，确保测试永远连到"本次测试自己启动的容器"，
#      而不会误连开发者本机正在使用的数据库。
#
#      这一点很重要：如果测试连到开发库，一次失败的测试就可能污染真实数据。
# ==========================================================================

spring:
  flyway:
    # 测试库同样执行真实迁移，不跳过 —— 否则迁移脚本的错误要在部署时才发现
    enabled: true

app:
  request:
    # ======================================================================
    # 测试期**开启**信任 X-Forwarded-For（生产默认 false）。
    #
    # 这不是在测试里放松安全，而是为了拿到"每请求独立的来源 IP"这个能力：
    #   限流按来源 IP 分桶，同一个 IP 的额度是**共享**的（注册桶只有 5 次/小时）。
    #   若测试都用容器网关的 127.0.0.1，几十个用例会互相消耗彼此的额度，
    #   于是出现"单跑通过、全量跑 429"这种最难排查的一类失败。
    #   允许测试用 XFF 指定来源后，每个用例拥有自己的桶，互不干扰；
    #   而限流逻辑本身（计数、窗口、Retry-After）仍是被真实执行的那份代码。
    #
    # "默认不信任 XFF"这条安全属性由 ClientIpResolverTest 以单元测试覆盖 ——
    # 它检验的正是 trustForwardedHeaders=false 时忽略该头的行为，
    # 因此这里开成 true 并不会让那条属性失去覆盖。
    # ======================================================================
    trust-forwarded-headers: true
  security:
    jwt:
      # 测试专用密钥，**只存在于测试资源中**，真实环境的密钥必须由 APP_JWT_SECRET 注入。
      # 写死在测试里是刻意的：测试必须可重复、无外部依赖，且它保护的是一分钟就销毁的容器库。
      # 长度 ≥ 32 字节是 HS256 的硬要求（256 bit）。
      secret: test-only-jwt-secret-for-camphub-integration-tests-0123456789
  workspace:
    # 下载令牌的签名密钥。与上面的 jwt.secret 同一条理由：留空时应用会**随机生成**
    # 并打印一条警告，那意味着重启后所有在途链接立即失效 —— 在测试里它表现为
    # "换个测试类就验不过令牌"这类难以指认的失败。显式钉死一个测试专用值。
    documents:
      public-base-url: ""
      download-token-secret: test-only-download-token-secret-for-camphub-tests-0123456789
    storage:
      # 测试期强制用本地后端：集成测试不应该要求一个外部的对象存储服务。
      # s3 那条路径由独立的容器化测试（S3ObjectStorageIT，自己起 MinIO）覆盖 ——
      # 那才是它该被验证的地方，而不是让每一个碰文档的测试都拖上一台 MinIO。
      backend: local
      # 测试期的文档字节写到系统临时目录，**不落在仓库里**。
      # 理由有两条：
      #   1) 上传测试会真的写文件，写在 ./data 下会让工作区多出一批未被忽略的产物；
      #   2) 存储目录由配置决定，因此把它指到别处本身就是对
      #      "storage.local-dir 这项配置真的生效"的一次验证。
      # 用 ${java.io.tmpdir} 而不是硬编码 /tmp：占位符从 Environment 解析，
      # 因此它在 macOS 与 Linux 上都指向该平台的临时目录（Windows 可移植性预留）。
      local-dir: ${java.io.tmpdir}/camphub-test-documents
    worker:
      # **测试期关掉轮询 worker**。这是一条纪律而不是省事：
      # 调度器会在任意时刻领走任务，于是"上传之后文档是什么状态"取决于
      # 机器快慢与运气 —— 这类不稳定会以"单跑通过、全量偶发失败"的形式出现，
      # 而它消耗的排查时间远超过这里省下的那点。
      # 需要驱动解析的测试自己调用 DocumentTaskProcessor，因此"哪一次解析真的发生了"
      # 完全由测试决定。
      enabled: false
      # 下面几项在 worker 被关掉时不会生效，但仍然显式写出：
      # ApplicationConfigStructureTest 断言这些键存在，而"测试 profile 覆盖了它们"
      # 是一种额外的说明 —— 它们与主配置的差异是有意的（测试不需要 3 秒的轮询节奏）。
      poll-interval-ms: 60000
      lease-seconds: 30
    parsing:
      # 测试用更小的分块上界，让两三行文本就能产生多个块，
      # 而不必在测试里塞进一份几千字的样本（那种样本没人会去读它断言了什么）。
      chunk-max-chars: 100
      # 行数/字符数上限在解析器单元测试里另有构造参数，
      # 这里只保证配置项存在且量级合理。
      max-pages: 50
      max-text-chars: 100000
      memory-bytes: 4194304

logging:
  level:
    root: WARN
    ai.camphub: INFO
    # 打开可看到 MyBatis 执行的真实 SQL，排查测试失败原因时很有用
    ai.camphub.system.infrastructure: INFO
    org.testcontainers: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
